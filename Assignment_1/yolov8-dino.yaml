# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8 + DINOv2: Injecting Global Semantics for Better Detection
# Reference: IISc I3D Lab (https://cambum.net/I3DLab/AI4DM.htm)

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8-dino.yaml' will call with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8-DINO backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, ConvDummy, []] # 0: Pass raw image directly from input
  - [-1, 1, Conv, [64, 3, 2]] # 1: P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 2: P2/4
  - [-1, 3, C2f, [128, True]] # 3
  - [-1, 1, Conv, [256, 3, 2]] # 4: P3/8
  - [-1, 6, C2f, [256, True]] # 5 (P3 backbone feature)
  - [-1, 1, Conv, [512, 3, 2]] # 6: P4/16
  - [-1, 6, C2f, [512, True]] # 7 (P4 backbone feature)
  - [-1, 1, Conv, [1024, 3, 2]] # 8: P5/32
  - [-1, 3, C2f, [1024, True]] # 9
  - [-1, 1, SPPF, [1024, 5]] # 10: End of spatial YOLO backbone (Stride 32)

  # Foundation Model Bypass & Global Context Injection
  - [0, 1, DINOv2, [1024]] # 11: Take Raw Image from layer 0, compute DINOv2 global embedding, project to 1024 ch
  - [[-1, 10], 1, Concat, [1]] # 12: Concatenate SPPF (Spatial, Layer 10) + DINO (Global, Layer 11)

# YOLOv8-DINO head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13: upsample fused P5
  - [[-1, 7], 1, Concat, [1]] # 14: cat with backbone P4 (layer 7)
  - [-1, 3, C2f, [512]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16: upsample to P3
  - [[-1, 5], 1, Concat, [1]] # 17: cat with backbone P3 (layer 5)
  - [-1, 3, C2f, [256]] # 18 (P3/8-small detection feature)

  - [-1, 1, Conv, [256, 3, 2]] # 19: downsample back to P4
  - [[-1, 15], 1, Concat, [1]] # 20: cat with head P4 (layer 15)
  - [-1, 3, C2f, [512]] # 21 (P4/16-medium detection feature)

  - [-1, 1, Conv, [512, 3, 2]] # 22: downsample back to P5
  - [[-1, 12], 1, Concat, [1]] # 23: cat with fused backbone P5 (layer 12)
  - [-1, 3, C2f, [1024]] # 24 (P5/32-large detection feature)

  - [[18, 21, 24], 1, Detect, [nc]] # 25: Detect(P3, P4, P5)
